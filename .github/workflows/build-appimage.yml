name: Build Fetch Studio AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets softprops/action-gh-release attach the AppImage to the release

jobs:
  appimage:
    # ubuntu-22.04 ships glibc 2.35, satisfying the glibc 2.34+ requirement
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libegl1 libfuse2 file wget

      - name: Verify glibc
        run: |
          ldd --version | head -1
          test "$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$' | cut -d. -f2)" -ge 34

      - name: Python dependencies
        run: pip install PyQt6 pyinstaller

      - name: Generate icon
        run: |
          QT_QPA_PLATFORM=offscreen python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from PyQt6.QtGui import QImage, QPainter, QColor, QFont
          from PyQt6.QtCore import Qt, QRectF
          app = QApplication([])
          img = QImage(256, 256, QImage.Format.Format_ARGB32); img.fill(Qt.GlobalColor.transparent)
          p = QPainter(img); p.setRenderHint(QPainter.RenderHint.Antialiasing)
          p.setBrush(QColor("#1e1e1e")); p.setPen(QColor("#3daee9")); p.drawRoundedRect(QRectF(8, 8, 240, 240), 40, 40)
          p.setFont(QFont("Monospace", 72, QFont.Weight.Bold)); p.setPen(QColor("#3daee9"))
          p.drawText(QRectF(0, 0, 256, 256), Qt.AlignmentFlag.AlignCenter, "FS>_"); p.end()
          img.save("fetchstudio.png")
          PY

      - name: Bundle with PyInstaller
        run: pyinstaller --noconfirm --onedir --name fetchstudio fetchstudio.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          cp -r dist/fetchstudio/* AppDir/usr/bin/
          cp /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0* AppDir/usr/lib/
          cp fetchstudio.png AppDir/fetchstudio.png
          cat > AppDir/fetchstudio.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=Fetch Studio
          Comment=Node-based neofetch/fastfetch designer
          Exec=fetchstudio
          Icon=fetchstudio
          Categories=System;Utility;
          Terminal=false
          DESK
          cat > AppDir/AppRun <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin/_internal:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/fetchstudio" "$@"
          RUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir FetchStudio-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: FetchStudio-x86_64.AppImage
          path: FetchStudio-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FetchStudio-x86_64.AppImage
