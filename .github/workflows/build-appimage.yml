name: Build Fetch Studio AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets softprops/action-gh-release attach the AppImage to the release

jobs:
  appimage:
    # ubuntu-22.04 ships glibc 2.35. The bundle is checked below so it never needs anything newer than the runner's glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libegl1 libfuse2 file wget binutils \
            libgl1 libxkbcommon0 libdbus-1-3

      - name: Python dependencies
        run: pip install PyQt6 pyinstaller

      - name: Read version
        id: ver
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('fetchstudio/common.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Fetch Studio $V"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION $V in fetchstudio/common.py"; exit 1
          fi

      - name: Tests (project validation, command trust, script generation, helper files)
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

      - name: Generate icon
        run: |
          QT_QPA_PLATFORM=offscreen python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from PyQt6.QtGui import QImage, QPainter, QColor, QFont, QFontMetricsF
          from PyQt6.QtCore import Qt, QRectF
          app = QApplication([])
          S, TEXT, ACC = 256, "FS>_", QColor("#3daee9")
          img = QImage(S, S, QImage.Format.Format_ARGB32); img.fill(Qt.GlobalColor.transparent)
          p = QPainter(img); p.setRenderHint(QPainter.RenderHint.Antialiasing); p.setRenderHint(QPainter.RenderHint.TextAntialiasing)
          p.setBrush(QColor("#1e1e1e")); p.setPen(ACC); p.drawRoundedRect(QRectF(8, 8, 240, 240), 40, 40)
          f = QFont("Monospace"); f.setStyleHint(QFont.StyleHint.Monospace); f.setBold(True)
          size = 80
          while size > 10:                                   # shrink until the whole text fits inside the box with a margin
              f.setPointSizeF(size); r = QFontMetricsF(f).tightBoundingRect(TEXT)
              if r.width() <= 168 and r.height() <= 168: break
              size -= 1
          p.setFont(f); p.setPen(ACC)
          r = QFontMetricsF(f).tightBoundingRect(TEXT)       # centre the ink, not the font box
          p.drawText(int(S / 2 - r.width() / 2 - r.left()), int(S / 2 - r.height() / 2 - r.top()), TEXT); p.end()
          img.save("fetchstudio.png")
          PY

      - name: Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --name fetchstudio \
            --add-data "fetchstudio/helper:fetchstudio/helper" run.py

      - name: Report the glibc the bundle needs
        env:
          # ubuntu-22.04 builds against glibc 2.35, so that is the oldest system the AppImage can run on.
          # To support 2.34 or older, build inside an older base image instead (e.g. a container: on this job).
          MAX_GLIBC: "2.35"
        run: |
          echo "Build host: $(ldd --version | head -1)"
          find dist/fetchstudio -type f -exec sh -c 'file -b "$1" | grep -q "^ELF"' _ {} \; -print > elf.txt
          : > need.txt
          while read -r f; do
            v=$(objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -Vu | tail -1)
            [ -n "$v" ] && echo "$v $f" >> need.txt
          done < elf.txt
          sort -V need.txt | tail -8 | sed 's/^/  needs glibc /'
          MAX=$(sort -V need.txt | tail -1 | cut -d' ' -f1)
          echo "Highest glibc required by the bundle: ${MAX:-none}"
          test -n "$MAX"
          test "$(printf '%s\n%s\n' "$MAX" "$MAX_GLIBC" | sort -V | tail -1)" = "$MAX_GLIBC" \
            || { echo "::error::The bundle needs glibc $MAX, newer than the allowed $MAX_GLIBC"; exit 1; }

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          cp -r dist/fetchstudio/* AppDir/usr/bin/
          cp /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0* AppDir/usr/lib/
          cp fetchstudio.png AppDir/fetchstudio.png
          cat > AppDir/fetchstudio.desktop <<DESK
          [Desktop Entry]
          Type=Application
          Name=Fetch Studio
          Comment=Node-based neofetch/fastfetch designer
          Exec=fetchstudio
          Icon=fetchstudio
          Categories=System;Utility;
          Terminal=false
          X-AppImage-Name=Fetch Studio
          X-AppImage-Version=${{ steps.ver.outputs.version }}
          DESK
          cat > AppDir/AppRun <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin/_internal:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/fetchstudio" "$@"
          RUN
          chmod +x AppDir/AppRun

      - name: Smoke-test the bundle (headless)
        run: |
          QT_QPA_PLATFORM=offscreen ./AppDir/AppRun --version
          QT_QPA_PLATFORM=offscreen ./AppDir/AppRun --extract-helper "$RUNNER_TEMP/helper"
          test -f "$RUNNER_TEMP/helper/fetchstudio-cal-helper" && test -f "$RUNNER_TEMP/helper/io.github.bobbycomet.fetchstudio.policy"   # helper is inside the AppImage

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir FetchStudio-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: FetchStudio-${{ steps.ver.outputs.version }}-x86_64.AppImage
          path: FetchStudio-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # the asset name stays FetchStudio-x86_64.AppImage so Griffin Updater keeps finding it
          files: FetchStudio-x86_64.AppImage
