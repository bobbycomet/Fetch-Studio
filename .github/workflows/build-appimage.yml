name: Build Fetch Studio AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets softprops/action-gh-release attach the AppImage to the release

jobs:
  appimage:
    # The runner VM is only the host. The build runs inside AlmaLinux 9 (RHEL 9 clone), whose glibc
    # is exactly 2.34. PyQt6 6.12 wheels are tagged manylinux_2_34 (they need glibc 2.34+), so
    # 2.34 is the lowest baseline that can install them, and every system library PyInstaller
    # collects here is linked against 2.34 at most. (On ubuntu-22.04, glibc is 2.35 and the
    # bundle fails the check below.)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:9
    steps:
      # We are root in the container, so no sudo. git must be installed before checkout.
      # (curl is already present as curl-minimal; installing "curl" would conflict with it.)
      - name: Base tools
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            ca-certificates git wget file binutils tar gzip findutils which

      - uses: actions/checkout@v4

      # actions/setup-python does not put python/pip on PATH reliably inside a container,
      # so Python 3.11 comes from uv (standalone build, glibc 2.17 baseline) in a venv
      - name: Python 3.11
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --seed --python 3.11 "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv/bin/python" --version

      - name: System dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm \
            libxcb libxkbcommon libxkbcommon-x11 mesa-libEGL mesa-libGL libglvnd-glx \
            dbus-libs fontconfig glib2 dejavu-sans-fonts

      - name: Python dependencies
        run: pip install PyQt6 pyinstaller

      - name: Read version
        id: ver
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('fetchstudio/common.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Fetch Studio $V"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION $V in fetchstudio/common.py"; exit 1
          fi

      - name: Tests (project validation, command trust, script generation, helper files)
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

      - name: Generate icon
        run: |
          QT_QPA_PLATFORM=offscreen python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from PyQt6.QtGui import QImage, QPainter, QColor, QFont
          from PyQt6.QtCore import Qt, QRectF
          app = QApplication([])
          img = QImage(256, 256, QImage.Format.Format_ARGB32); img.fill(Qt.GlobalColor.transparent)
          p = QPainter(img); p.setRenderHint(QPainter.RenderHint.Antialiasing)
          p.setBrush(QColor("#1e1e1e")); p.setPen(QColor("#3daee9")); p.drawRoundedRect(QRectF(8, 8, 240, 240), 40, 40)
          p.setFont(QFont("Monospace", 72, QFont.Weight.Bold)); p.setPen(QColor("#3daee9"))
          p.drawText(QRectF(0, 0, 256, 256), Qt.AlignmentFlag.AlignCenter, "FS>_"); p.end()
          img.save("fetchstudio.png")
          PY

      - name: Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --name fetchstudio \
            --add-data "fetchstudio/helper:fetchstudio/helper" run.py

      - name: Verify the bundle needs glibc 2.34 or older
        shell: bash
        run: |
          echo "Build host: $(ldd --version | head -1)"
          LIMIT=2.34
          MAX=""
          OFFENDERS=""
          while IFS= read -r f; do
            file -b "$f" | grep -q '^ELF' || continue
            v=$(objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -Vu | tail -1)
            [ -n "$v" ] || continue
            MAX=$(printf '%s\n%s\n' "${MAX:-0}" "$v" | sort -V | tail -1)
            if [ "$(printf '%s\n%s\n' "$v" "$LIMIT" | sort -V | tail -1)" != "$LIMIT" ]; then
              OFFENDERS="${OFFENDERS}${v}  ${f}"$'\n'
            fi
          done < <(find dist/fetchstudio -type f)
          echo "Highest glibc symbol version required by the bundle: ${MAX:-none}"
          test -n "$MAX"
          if [ -n "$OFFENDERS" ]; then
            echo "Files that need glibc newer than $LIMIT:"
            printf '%s' "$OFFENDERS"
            echo "::error::The bundle needs glibc $MAX, newer than the supported $LIMIT"
            exit 1
          fi

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          cp -r dist/fetchstudio/* AppDir/usr/bin/
          cp /usr/lib64/libxcb-cursor.so.0* AppDir/usr/lib/
          cp fetchstudio.png AppDir/fetchstudio.png
          cat > AppDir/fetchstudio.desktop <<DESK
          [Desktop Entry]
          Type=Application
          Name=Fetch Studio
          Comment=Node-based neofetch/fastfetch designer
          Exec=fetchstudio
          Icon=fetchstudio
          Categories=System;Utility;
          Terminal=false
          X-AppImage-Name=Fetch Studio
          X-AppImage-Version=${{ steps.ver.outputs.version }}
          DESK
          cat > AppDir/AppRun <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin/_internal:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/fetchstudio" "$@"
          RUN
          chmod +x AppDir/AppRun

      - name: Smoke-test the bundle (headless)
        run: |
          QT_QPA_PLATFORM=offscreen ./AppDir/AppRun --version
          QT_QPA_PLATFORM=offscreen ./AppDir/AppRun --extract-helper "$RUNNER_TEMP/helper"
          test -f "$RUNNER_TEMP/helper/fetchstudio-cal-helper"

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir FetchStudio-x86_64.AppImage
          tar czf fetchstudio-helper.tar.gz -C fetchstudio/helper .

      - uses: actions/upload-artifact@v4
        with:
          name: FetchStudio-${{ steps.ver.outputs.version }}-x86_64.AppImage
          path: |
            FetchStudio-x86_64.AppImage
            fetchstudio-helper.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # the asset name stays FetchStudio-x86_64.AppImage so Griffin Updater keeps finding it
          files: |
            FetchStudio-x86_64.AppImage
            fetchstudio-helper.tar.gz
